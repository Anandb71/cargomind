[project]
name = "cargomind"
version = "0.1.0"
description = "CargoMind - self-healing multi-agent Logistics Handler on Google ADK, Gemini, Google Maps and MCP"
readme = "README.md"
authors = [
    { name = "anandb71", email = "anandbiju71@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.12.0",
    "httpx>=0.28.1",
    "litellm>=1.105.1",
    "mcp[cli]>=2.3.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cargomind = "cargomind.cli:main"
cargomind-web = "cargomind.web.server:main"
cargomind-mcp = "cargomind.mcp_server.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
